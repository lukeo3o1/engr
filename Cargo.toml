[workspace]
members = ["crates/engr"]
resolver = "2"

[workspace.package]
# There is no version number: one moving release tag, `latest`, and a commit id
# compiled in. Cargo demands the field, so it stays at zero rather than implying
# a release history that does not exist.
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lukeo3o1/engr"
rust-version = "1.78"
