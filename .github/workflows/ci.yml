name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} Rust stable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo run -p engr -- --help
      - name: installer
        if: matrix.os != 'windows-latest'
        run: ./install.sh --bin-dir "$RUNNER_TEMP/bin"
      - name: installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\install.ps1 -BinDir "$env:RUNNER_TEMP\bin"
