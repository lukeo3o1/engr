name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} Rust stable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo run -p engr -- --help
      - run: cargo run -p engr -- --version
      # --from-source, not the default download path: what needs testing is this
      # commit's installer against this commit's code, not whatever the last
      # release happens to hold.
      - name: installer
        if: matrix.os != 'windows-latest'
        run: ./install.sh --from-source --bin-dir "$RUNNER_TEMP/bin"
      - name: installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\install.ps1 -FromSource -BinDir "$env:RUNNER_TEMP\bin"
